proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - hk-hy2
      - hk-reality
      - Home-Egress
      - Oracle-Proxy-Extra
      - oracle-gateway-hy2-backup
      - ali-socks-oracle-egress
      - ali-http-oracle-egress
      - hk-socks
      - hk-http
      - DIRECT

  - name: HK-Transit
    type: select
    proxies:
      - hk-hy2
      - hk-reality
      - hk-socks
      - hk-http

  - name: Home-Egress
    type: select
    proxies:
      - home-http-via-hk
      - home-http-direct
      - DIRECT

  - name: Oracle-Proxy-Extra
    type: select
    proxies:
      - oracle-proxy-hy2-extra
      - oracle-proxy-shadowsocks-extra
      - oracle-proxy-trojan-extra
      - oracle-proxy-tuic-extra
      - oracle-proxy-xray-reality-extra
      - DIRECT

  - name: HK
    type: select
    proxies:
      - hk-hy2
      - hk-reality
      - hk-socks
      - hk-http

  - name: Fallback
    type: select
    proxies:
      - oracle-gateway-hy2-backup
      - Oracle-Proxy-Extra
      - ali-socks-oracle-egress
      - ali-http-oracle-egress
      - DIRECT

  - name: Big-Transfer
    type: select
    proxies:
      - hk-socks
      - hk-http
      - ali-socks-oracle-egress
      - ali-http-oracle-egress
      - DIRECT

